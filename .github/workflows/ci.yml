name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Playwright 1.56 (pinned) has no browser for Ubuntu 26.04, which ubuntu-latest became.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (web app and the Mac app's main process)
        run: npm run desktop:build
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (and the Mac app, under a virtual display)
        run: xvfb-run -a npm run e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
